<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モテ度診断</title>
</head>

<body>

{% for question in questions %}

    {% ifchanged question.category %}
        <h2>{{ question.get_category_display }}</h2>
    {% endifchanged %}

    <h3>
        Q{{ question.order }}. {{ question.text }}
    </h3>

    {% for choice in question.choices.all %}
        <label>
            <input
                type="radio"
                name="question_{{ question.id }}"
                value="{{ choice.points }}"
            >

            {% if choice.order == 1 %}A{% endif %}
            {% if choice.order == 2 %}B{% endif %}
            {% if choice.order == 3 %}C{% endif %}
            {% if choice.order == 4 %}D{% endif %}

            {{ choice.text }}
        </label>

        <br>
    {% endfor %}

{% endfor %}

</body>
</html>
