<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% for question in questions %}

    {% ifchanged question.category %}
    <h2>{{ question.get_category_display }}</h2>
    {% endifchanged %}
    
    <h3>
        Q{{ question.order }}. {{ question.text }}
    </h3>

    {% for choice in question.choices.all %}
        <label>
            <input
                type="radio"
                name="question_{{ question.id }}"
                value="{{ choice.points }}"
            >
            {{ choice.text }}
        </label>
    {% endfor %}

{% endfor %}

</body>
</html>
